name: Discord Notify

on:
  push:
    branches: [main, dev]
  release:
    types: [published]
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Build message
        id: msg
        run: |
          set -euo pipefail

          EVENT_NAME="${{ github.event_name }}"
          REPO="${{ github.repository }}"
          ACTOR="${{ github.actor }}"
          BASE_URL="${{ github.server_url }}/${{ github.repository }}"

          CONTENT=""

          if [ "$EVENT_NAME" = "push" ]; then
            BRANCH="${{ github.ref_name }}"
            COMMIT="${{ github.sha }}"
            MSG="${{ github.event.head_commit.message }}"
            CONTENT="📌 Push to ${BRANCH}\n> ${MSG}"
          fi

          if [ "$EVENT_NAME" = "release" ]; then
          TAG="${{ github.event.release.tag_name }}"
          NAME="${{ github.event.release.name }}"
          CONTENT="🚀 Release published\n**${NAME}** (${TAG})"
          fi
          
          if [ "$EVENT_NAME" = "pull_request" ]; then
            MERGED="${{ github.event.pull_request.merged }}"
            if [ "$MERGED" = "true" ]; then
              PRNUM="${{ github.event.pull_request.number }}"
              TITLE="${{ github.event.pull_request.title }}"
              CONTENT="✅ PR #${PRNUM} merged\n**${TITLE}**"
            else
              echo "PR closed but not merged — skipping."
              exit 0
            fi
          fi

          echo "content<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$CONTENT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Send to Discord (embed-only)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CONTENT: ${{ steps.msg.outputs.content }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          # Repo-based emoji + color
          case "$REPO" in
            McGeeLabs/sentinel-bg-monitor)
              BADGE="📟"
              COLOR=3111081 ;; # medical teal
            McGeeLabs/NebulaNode)
              BADGE="⚙️"
              COLOR=5793266 ;; # infra blue
            McGeeLabs/NexaBot)
              BADGE="🤖"
              COLOR=10070709 ;; # automation purple
            McGeeLabs/NebulaNest)
              BADGE="🧠"
              COLOR=15105570 ;; # orchestration violet
            *)
              BADGE="📦"
              COLOR=5814783 ;; # default gray-blue
          esac

          TITLE="${BADGE} GitHub Update"

          TARGET_URL="$URL"

          if [ "$EVENT" = "push" ]; then
            TARGET_URL="$URL/commit/${{ github.sha }}"
            TITLE="${BADGE} Push to ${REPO##*/}"
          elif [ "$EVENT" = "release" ]; then
            TARGET_URL="${{ github.event.release.html_url }}"
            TITLE="${BADGE} New Release"
          elif [ "$EVENT" = "pull_request" ]; then
            TARGET_URL="${{ github.event.pull_request.html_url }}"
            TITLE="${BADGE} Pull Request Merged"
          fi

          JSON=$(jq -n \
          --arg title "$TITLE" \
          --arg desc "$CONTENT" \
          --arg url "$TARGET_URL" \
          --arg footer "by $ACTOR" \
          --argjson color "$COLOR" \
          '{
            embeds: [{
              title: $title,
              url: $url,
              description: $desc,
              color: $color,
              footer: { text: $footer }
            }]
          }')

          echo "Posting payload:"
          echo "$JSON"

          HTTP_CODE=$(curl -sS -o /tmp/discord_resp.txt -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$JSON" \
            "$DISCORD_WEBHOOK_URL")

          echo "Discord HTTP status: $HTTP_CODE"
          echo "Discord response:"
          cat /tmp/discord_resp.txt || true

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            exit 1
          fi
