[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
  -D USER_SETUP_LOADED=1
  -include include/TFT_eSPI_Setup.h
  -std=gnu++17
  -DWIFI_SSID=\"R2D2\"
  -DWIFI_PASS=\"R2D2!D3athSt@r\"
  -DNIGHTSCOUT_URL=\"https://midokite.tx.nightscoutpro.com/\"
  -DNIGHTSCOUT_TOKEN=\"display-f0f71874fd7b444e\"

lib_deps =
  bodmer/TFT_eSPI
  paulstoffregen/XPT2046_Touchscreen
  SPI

board_build.filesystem = littlefs
monitor_dtr = 0
monitor_rts = 0
